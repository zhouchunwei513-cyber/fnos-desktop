name: Build & Release

# 推送 v* 标签（如 v1.27.1）时自动构建 Windows 便携版并发布到 Releases；
# 也可在 Actions 页面手动触发（Run workflow，可填自定义 mpv 直链）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mpv_url:
        description: '可选：自定义 mpv 运行时 .7z 直链；留空则用本仓库 mpv-runtime Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: 下载内置 mpv 运行时（Windows x86_64，GPL）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MPV_URL: ${{ github.event.inputs.mpv_url }}
        run: |
          New-Item -ItemType Directory -Force -Path mpv | Out-Null
          if (Test-Path mpv/mpv.exe) { Write-Host "mpv 已存在，跳过"; exit 0 }
          if ([string]::IsNullOrWhiteSpace($env:MPV_URL)) {
            $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent'='fnos-build' } `
              "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/tags/mpv-runtime"
            $asset = $rel.assets | Where-Object { $_.name -eq 'mpv-runtime-x86_64.7z' } | Select-Object -First 1
            if (-not $asset) { throw "未找到 mpv-runtime Release 资产 mpv-runtime-x86_64.7z" }
            Write-Host "使用内置 mpv 运行时: $($asset.name) $([math]::Round($asset.size/1MB,1)) MB"
            curl.exe -L --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -o mpv.7z $asset.url
          } else {
            Write-Host "使用自定义 mpv 直链: $($env:MPV_URL)"
            curl.exe -L --retry 3 -o mpv.7z $env:MPV_URL
          }
          if (-not (Test-Path mpv.7z)) { throw "mpv 下载失败" }
          & 7z x mpv.7z -omvpmpt -y | Out-Null
          $exe = Get-ChildItem -Recurse mvpmpt -Filter mpv.exe | Select-Object -First 1
          if (-not $exe) { throw "解压后未找到 mpv.exe" }
          Copy-Item $exe.FullName "mpv/mpv.exe" -Force
          $d3d = Get-ChildItem -Recurse mvpmpt -Filter d3dcompiler_43.dll | Select-Object -First 1
          if ($d3d) { Copy-Item $d3d.FullName "mpv/d3dcompiler_43.dll" -Force }
          Get-ChildItem mpv | ForEach-Object { Write-Host "  mpv/$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Build Windows setup (nsis only)
        run: pnpm exec electron-builder --x64 --publish never   # target 由 package.json win.target 驱动（portable+zip）

      - name: 校验内置 mpv 内核已打包（防止产出无内核安装包）
        shell: pwsh
        run: |
          $out = "dist/win-unpacked/resources/mpv/mpv.exe"
          if (-not (Test-Path $out)) {
            # 兼容不同输出目录，兜底全局搜索
            $found = Get-ChildItem -Recurse -Path dist -Filter mpv.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw "打包产物中未找到内置 mpv.exe，请勿发布此版本（下载步骤可能失败）" }
            Write-Host "mpv.exe 已打包: $($found.FullName) $([math]::Round($found.Length/1MB,1)) MB"
          } else {
            $f = Get-Item $out
            Write-Host "mpv.exe 已打包: $out $([math]::Round($f.Length/1MB,1)) MB"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNOS-${{ github.ref_name }}
          path: |
            dist/FNOS-*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v2.4.10 发布链修复：softprops/action-gh-release 的 files glob 空匹配默认静默、
          # 上传软失败偶发（v2.4.9 实录：step success 但 Release assets=0）。改为 gh CLI 显式
          # 流程：无产物直接失败（拒绝空 Release）、上传 4 次重试、--clobber 幂等可重跑。
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'FNOS-*.exe' }
          if (-not $files) { throw "dist 下 FNOS-*.exe / FNOS-*.zip 无匹配产物，拒绝发布空 Release" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $extra = @()
            if ($tag -match '(-rc|-beta)') { $extra += '--prerelease' }
            gh release create $tag --generate-notes @extra
            if ($LASTEXITCODE -ne 0) { throw "gh release create $tag 失败" }
          }
          foreach ($f in $files) {
            $ok = $false
            for ($i = 1; $i -le 4; $i++) {
              gh release upload $tag $f.FullName --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "上传 $($f.Name) 第 $i 次失败，5s 后重试"
              Start-Sleep -Seconds 5
            }
            if (-not $ok) { throw "资产 $($f.Name) 连续 4 次上传失败" }
          }
          Write-Host "Release $tag 资产就绪：$($files.Name -join ', ')"
          # v2.4.11 发布后即刻回读自证：把资产清单写入 Release body，区分“gh 上传假成功”
          # 与“平台侧移除”（v2.4.9/2.4.10 两种上传工具均绿但 assets 恒空的取证通道）。
          Start-Sleep -Seconds 3
          $view = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($view.assets | ForEach-Object { $_.name })
          if ($names.Count -eq 0) { throw "release assets not visible via auth (see job log)" }
          Write-Host "Release $tag visibility check passed (auth-read): $($names -join ', ')"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # v2.14.0 macOS 支持：不签名（identity:null + 关闭证书自动发现），
      # 用户侧首次打开需右键→打开 或 xattr -dr com.apple.quarantine。
      # mpv 外挂内核为 Windows 专属；mac 播放走内置 hls.js 网页内核，无需下载 mpv。
      - name: Build macOS dmg (x64+arm64)
        shell: bash
        run: pnpm exec electron-builder --mac --x64 --arm64 --publish never

      - name: 校验 macOS 产物
        shell: bash
        run: |
          ls -la dist/ || true
          DMG=$(ls dist/FNOS-*-mac-*.dmg 2>/dev/null | wc -l | tr -d ' ')
          echo "dmg=$DMG"
          if [ "$DMG" -lt 2 ]; then
            echo "::error::macOS 产物缺失（期望 dmg×2 zip×2，实际 dmg=$DMG zip=$ZIP）"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNOS-mac-${{ github.ref_name }}
          path: |
            dist/FNOS-*-mac-*.dmg
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 与 build-windows 并发：release 可能已由 win job 创建。view 失败→create，
          # create 失败再回查 view（竞态被对方先建则视为已存在），最终仍不存在才失败。
          set -uo pipefail
          tag="$GITHUB_REF_NAME"
          files=()
          for f in dist/FNOS-*-mac-*.dmg; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::dist 下 FNOS-*-mac-*.dmg/.zip 无匹配产物，拒绝发布空资产"
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            extra=()
            if [[ "$tag" == *-rc* || "$tag" == *-beta* ]]; then extra+=(--prerelease); fi
            if ! gh release create "$tag" --generate-notes "${extra[@]}" 2>/dev/null; then
              if ! gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::gh release create $tag 失败且 release 不存在"
                exit 1
              fi
              echo "release $tag 已由并发 job 创建，继续上传"
            fi
          fi
          for f in "${files[@]}"; do
            ok=0
            for i in 1 2 3 4; do
              if gh release upload "$tag" "$f" --clobber; then ok=1; break; fi
              echo "上传 $(basename "$f") 第 $i 次失败，5s 后重试"
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::资产 $(basename "$f") 连续 4 次上传失败"
              exit 1
            fi
          done
          echo "Release $tag macOS 资产就绪：${files[*]}"
          sleep 3
          names=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null)
          echo "auth-read visibility: ${names:-EMPTY}"
