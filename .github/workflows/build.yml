name: Build & Release

# 推送 v* 标签（如 v1.27.1）时自动构建 Windows 便携版并发布到 Releases；
# 也可在 Actions 页面手动触发（Run workflow）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mpv_url:
        description: '可选：指定 mpv Windows x86_64 构建(.7z)直链；留空自动取最新官方构建'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: 自动下载内置 mpv（Windows x86_64，GPL，官方 SourceForge 构建）
        shell: pwsh
        env:
          MPV_URL: ${{ github.event.inputs.mpv_url }}
        run: |
          New-Item -ItemType Directory -Force -Path mpv | Out-Null
          if (Test-Path mpv/mpv.exe) { Write-Host "mpv 已存在，跳过"; exit 0 }
          $url = $env:MPV_URL
          if ([string]::IsNullOrWhiteSpace($url)) {
            $rss = "https://sourceforge.net/projects/mpv-player-windows/rss?path=/64bit"
            [xml]$feed = Invoke-RestMethod -Headers @{ 'User-Agent'='fnos-build' } $rss
            $item = $feed.rss.channel.item |
              Where-Object { $_.title -match '^mpv-x86_64-.*\.7z$' } |
              Select-Object -First 1
            if (-not $item) { throw "未能从 sourceforge 定位 mpv x86_64 构建，可手动触发时填 mpv_url" }
            $url = $item.link
            Write-Host "最新 mpv 构建: $($item.title)"
          }
          Write-Host "下载: $url"
          curl.exe -L --retry 3 -o mpv.7z $url
          if (-not (Test-Path mpv.7z)) { throw "mpv 下载失败" }
          & 7z x mpv.7z -omvpmpt -y | Out-Null
          $exe = Get-ChildItem -Recurse mvpmpt -Filter mpv.exe | Select-Object -First 1
          if (-not $exe) { throw "解压后未找到 mpv.exe" }
          Copy-Item $exe.FullName "mpv/mpv.exe" -Force
          $d3d = Get-ChildItem -Recurse mvpmpt -Filter d3dcompiler_43.dll | Select-Object -First 1
          if ($d3d) { Copy-Item $d3d.FullName "mpv/d3dcompiler_43.dll" -Force }
          Get-ChildItem mpv | ForEach-Object { Write-Host "  mpv/$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Build Windows portable
        run: pnpm exec electron-builder --win portable --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNOS-${{ github.ref_name }}
          path: dist/FNOS-*-portable.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FNOS-*-portable.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
