name: Build & Release

# 推送 v* 标签（如 v4.0.0）时自动构建 Windows NSIS 安装包并发布到 Releases；
# 也可在 Actions 页面手动触发（Run workflow，可填自定义 mpv 直链）。
# v4.0.0 起：构建前做 JS 语法自检，构建后校验 mpv.exe 与安装包体积，任一不通过即不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mpv_url:
        description: '可选：自定义 mpv 运行时 .7z 直链；留空则用本仓库 mpv-runtime Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 语法自检（node --check）
        shell: pwsh
        run: |
          $fail = 0
          $files = Get-ChildItem -Path . -Filter *.js -File
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "::error file=$($f.Name)::JS 语法错误"; $fail = 1 }
          }
          if ($fail -ne 0) { throw "存在 JS 语法错误，终止构建" }
          Write-Host "语法自检通过：$($files.Count) 个文件"

      - name: 下载内置 mpv 运行时（Windows x86_64，GPL）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MPV_URL: ${{ github.event.inputs.mpv_url }}
        run: |
          New-Item -ItemType Directory -Force -Path mpv | Out-Null
          if (Test-Path mpv/mpv.exe) { Write-Host "mpv 已存在，跳过"; exit 0 }
          if ([string]::IsNullOrWhiteSpace($env:MPV_URL)) {
            $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent'='fnos-build' } `
              "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/tags/mpv-runtime"
            $asset = $rel.assets | Where-Object { $_.name -eq 'mpv-runtime-x86_64.7z' } | Select-Object -First 1
            if (-not $asset) { throw "未找到 mpv-runtime Release 资产 mpv-runtime-x86_64.7z" }
            Write-Host "使用内置 mpv 运行时: $($asset.name) $([math]::Round($asset.size/1MB,1)) MB"
            curl.exe -L --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -o mpv.7z $asset.url
          } else {
            Write-Host "使用自定义 mpv 直链: $($env:MPV_URL)"
            curl.exe -L --retry 3 -o mpv.7z $env:MPV_URL
          }
          if (-not (Test-Path mpv.7z)) { throw "mpv 下载失败" }
          & 7z x mpv.7z -omvpmpt -y | Out-Null
          $exe = Get-ChildItem -Recurse mvpmpt -Filter mpv.exe | Select-Object -First 1
          if (-not $exe) { throw "解压后未找到 mpv.exe" }
          Copy-Item $exe.FullName "mpv/mpv.exe" -Force
          $d3d = Get-ChildItem -Recurse mvpmpt -Filter d3dcompiler_43.dll | Select-Object -First 1
          if ($d3d) { Copy-Item $d3d.FullName "mpv/d3dcompiler_43.dll" -Force }
          Get-ChildItem mpv | ForEach-Object { Write-Host "  mpv/$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }

      - name: 构建卸载器（csc，随包分发到 resources/uninstaller/）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/uninstaller | Out-Null
          powershell -ExecutionPolicy Bypass -File tools/uninstaller/build-uninstaller.ps1 -OutDir bin/uninstaller
          if (-not (Test-Path bin/uninstaller/FNOS-Uninstaller.exe)) { throw "卸载器编译失败" }
          $f = Get-Item bin/uninstaller/FNOS-Uninstaller.exe
          Write-Host ("卸载器就绪：{0} {1} KB" -f $f.Name, [math]::Round($f.Length/1KB,1))

      - name: Build Windows setup (nsis only)
        run: npx electron-builder --x64 --publish never   # target 由 package.json build.win.target 驱动（NSIS x64）

      - name: 校验内置 mpv 内核已打包（防止产出无内核安装包）
        shell: pwsh
        run: |
          $out = "dist/win-unpacked/resources/mpv/mpv.exe"
          if (-not (Test-Path $out)) {
            # 兼容不同输出目录，兜底全局搜索
            $found = Get-ChildItem -Recurse -Path dist -Filter mpv.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw "打包产物中未找到内置 mpv.exe，请勿发布此版本（下载步骤可能失败）" }
            Write-Host "mpv.exe 已打包: $($found.FullName) $([math]::Round($found.Length/1MB,1)) MB"
          } else {
            $f = Get-Item $out
            Write-Host "mpv.exe 已打包: $out $([math]::Round($f.Length/1MB,1)) MB"
          }

      - name: 校验安装包体积（拒绝空包 / 缺内核）
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'FNOS-*-setup.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "未找到 NSIS 安装包 FNOS-*-setup.exe，拒绝发布" }
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "安装包：$($setup.Name) $mb MB"
          if ($setup.Length -lt 60MB) { throw "安装包体积异常（$mb MB），疑似未打入 MPV 内核，拒绝发布" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNOS-${{ github.ref_name }}
          path: |
            dist/FNOS-*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v2.4.10 发布链修复：softprops/action-gh-release 的 files glob 空匹配默认静默、
          # 上传软失败偶发（v2.4.9 实录：step success 但 Release assets=0）。改为 gh CLI 显式
          # 流程：无产物直接失败（拒绝空 Release）、上传 4 次重试、--clobber 幂等可重跑。
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'FNOS-*.exe' }
          if (-not $files) { throw "dist 下 FNOS-*.exe / FNOS-*.zip 无匹配产物，拒绝发布空 Release" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $extra = @()
            if ($tag -match '(-rc|-beta)') { $extra += '--prerelease' }
            gh release create $tag --title "FNOS $tag" --generate-notes @extra 2>$null
            if ($LASTEXITCODE -ne 0) {
              # 竞态幂等：并发 mac job 可能已创建 release，回查 view，已存在则继续上传
              gh release view $tag 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "gh release create $tag 失败" }
              Write-Host "release $tag 已由并发 job 创建，继续上传"
            }
          }
          foreach ($f in $files) {
            $ok = $false
            for ($i = 1; $i -le 4; $i++) {
              gh release upload $tag $f.FullName --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "上传 $($f.Name) 第 $i 次失败，5s 后重试"
              Start-Sleep -Seconds 5
            }
            if (-not $ok) { throw "资产 $($f.Name) 连续 4 次上传失败" }
          }
          Write-Host "Release $tag 资产就绪：$($files.Name -join ', ')"
          # v2.4.11 发布后即刻回读自证：把资产清单写入 Release body，区分“gh 上传假成功”
          # 与“平台侧移除”（v2.4.9/2.4.10 两种上传工具均绿但 assets 恒空的取证通道）。
          Start-Sleep -Seconds 3
          $view = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($view.assets | ForEach-Object { $_.name })
          if ($names.Count -eq 0) { throw "release assets not visible via auth (see job log)" }
          Write-Host "Release $tag visibility check passed (auth-read): $($names -join ', ')"

  # ===================== v5.1.0：macOS 构建（阶段一：能构建 + 能启动） =====================
  # 产出 dmg + zip（arm64 / x64 各一份），随 tag 一起挂到同一个 Release。
  # 注意：
  #   1) 本轮不做签名/公证（hardenedRuntime=false，CSC_IDENTITY_AUTO_DISCOVERY=false），
  #      用户首次打开需要右键「打开」或在系统设置里放行；正式分发前需补 Developer ID + notarize。
  #   2) macOS 不打包 mpv 二进制（体积 + 签名 + GPL 分发链路），运行时探测系统 mpv。
  #   3) Windows job 完全未改动；两个 job 并行，Release 创建做了并发幂等处理（已在 Windows job 内）。
  #   4) v5.1.0 首发实测踩坑：原先 runs-on: macos-14 导致 job 0 步、conclusion=cancelled、
  #      runner_name 为空（check-run annotation：The configuration
  #      'macos-14-arm64-us-default' is not supported）。原因是 GitHub 已于 2026-11-02
  #      整体下线 macOS 14 runner 镜像（actions/runner-images#15226），标签彻底失效 →
  #      任务永远等不到 runner。与账单额度 / workflow 语法 / permissions / matrix 无关。
  #      现改为 macos-15（GA 的 arm64 / M1 镜像，公共仓库分钟数免费不限）。
  #      若将来 macos-15 退役，按 docs.github.com「Standard GitHub-hosted runners」表格换新标签，
  #      或直接用 macos-latest 让 GitHub 自动迁移；Intel 机器用 macos-15-intel。
  #   5) 两个 matrix 条目共用同一 arm64 主机没问题：electron-builder 跨架构打包只是下载
  #      不同架构的 Electron 预编译包，x64 产物在 arm64 主机上照样能出。
  build-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 语法自检（node --check，与 Windows job 同口径）
        run: |
          fail=0
          for f in *.js; do
            node --check "$f" || { echo "::error file=$f::JS 语法错误"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "存在 JS 语法错误，终止构建"; exit 1; }
          echo "语法自检通过：$(ls -1 *.js | wc -l | tr -d ' ') 个文件"

      - name: 生成 macOS 图标（sips + iconutil → build/icons/icon.icns）
        run: bash build/make-icns.sh

      - name: 打包 mpv 运行时（Homebrew → 最小 .app，随包分发）
        run: bash build/mac-bundle-mpv.sh ${{ matrix.arch }}

      - name: Build macOS ${{ matrix.arch }}（dmg + zip）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: 校验产物（dmg / zip 存在且体积合理）
        run: |
          arch='${{ matrix.arch }}'
          dmg=$(ls dist/FNOS-*-mac-${arch}.dmg 2>/dev/null | head -1 || true)
          zip=$(ls dist/FNOS-*-mac-${arch}.zip 2>/dev/null | head -1 || true)
          [ -n "$dmg" ] || { echo "::error::未找到 ${arch} dmg 产物"; exit 1; }
          [ -n "$zip" ] || { echo "::error::未找到 ${arch} zip 产物"; exit 1; }
          # 安装包体积下限只防「空包 / 打包失败」，mac 不含 mpv 内核，40MB 足够
          for f in "$dmg" "$zip"; do
            sz=$(stat -f%z "$f")
            echo "$f  $((sz / 1024 / 1024)) MB"
            [ "$sz" -gt $((40 * 1024 * 1024)) ] || { echo "::error::产物体积异常：$f"; exit 1; }
          done
          # app 包必须存在（防止 files 配置写错导致空壳）
          app=$(find dist -maxdepth 2 -name 'FNOS.app' -type d | head -1 || true)
          if [ -n "$app" ]; then
            echo "app: $app"
          else
            echo "::warning::未找到 dist/**/FNOS.app（dmg 已生成，跳过该检查）"
          fi

      - name: Upload artifact (macOS ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: FNOS-mac-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            dist/FNOS-*-mac-${{ matrix.arch }}.dmg
            dist/FNOS-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Release（dmg / zip 追加到同一个 tag Release）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=$(ls dist/FNOS-*-mac-${{ matrix.arch }}.dmg dist/FNOS-*-mac-${{ matrix.arch }}.zip 2>/dev/null || true)
          [ -n "$files" ] || { echo "::error::没有可上传的 mac 产物"; exit 1; }
          # 并发幂等：Windows job 可能先/后创建 release，先等它出现再上传
          for i in 1 2 3 4 5 6; do
            gh release view "$tag" >/dev/null 2>&1 && break
            if [ "$i" -eq 1 ]; then
              extra=""
              case "$tag" in *-rc|*-beta) extra="--prerelease" ;; esac
              gh release create "$tag" --title "FNOS $tag" --generate-notes $extra >/dev/null 2>&1 || true
            fi
            sleep 5
          done
          for f in $files; do
            ok=0
            for i in 1 2 3 4; do
              if gh release upload "$tag" "$f" --clobber; then ok=1; break; fi
              echo "上传 $f 第 $i 次失败，5s 后重试"; sleep 5
            done
            [ "$ok" -eq 1 ] || { echo "::error::资产 $f 连续 4 次上传失败"; exit 1; }
          done
          echo "mac ${{ matrix.arch }} 资产上传完成：$files"

  # ===================== 备用通道（默认不启用）：无 macOS runner 时出 mac zip =====================
  # 实测结论（electron-builder 26.15.3）：
  #   - ubuntu/linux 主机可以打包 mac 的 zip / dir（未签名），产物结构与 mac 主机一致；
  #   - dmg 必须在 macOS 上打：dmg-builder 依赖 sips / hdiutil / tiffutil 与 darwin 版 dmgbuild，
  #     在 Linux 上会直接失败（⨯ sips process failed ENOENT）；
  #   - 代码签名 / 公证只能在 macOS（官方文档：macOS Code Signing works only on macOS. Cannot be fixed.）
  # 因此若 mac runner 再次不可用（额度、镜像退役、故障），可临时改为下面的 ubuntu job 出 zip-only：
  #   runs-on: ubuntu-latest
  #   steps: 同 build-macos，但跳过 make-icns.sh（sips/iconutil 是 macOS 独有），
  #          并把 Build 步骤换成 npx electron-builder --mac zip --${{ matrix.arch }} --publish never
  #   （未签名 zip，用户需 xattr -cr 或在「隐私与安全性」里放行；先提交一份 build/icons/icon.icns 更好）
