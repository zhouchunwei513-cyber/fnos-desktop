name: macOS Build

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（形如 mac-v1.0.0；留空则只构建产物不发布）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (arm64 + x64)
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ''
      CSC_KEY_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show toolchain
        run: |
          node -v
          npm -v
          sw_vers
          xcodebuild -version || true

      - name: Install dependencies
        working-directory: mac
        run: npm install --no-audit --no-fund

      - name: Sanity check sources
        working-directory: mac
        run: |
          node --check src/main/index.js
          node --check src/main/windows.js
          node --check src/main/menu.js
          node --check src/main/tray.js
          node --check src/main/store.js
          node --check src/main/nav.js
          node --check src/main/updater.js
          node --check src/main/logger.js
          node --check src/main/ipc.js
          node --check src/preload/app-preload.js
          node --check src/preload/settings-preload.js
          node --check src/renderer/shell.js
          node --check src/renderer/settings.js

      - name: Build dmg + zip
        working-directory: mac
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Inspect artifacts
        working-directory: mac
        run: |
          ls -lh dist || true
          for f in dist/*.dmg dist/*.zip; do
            [ -e "$f" ] || continue
            echo "== $f"
            file "$f"
            du -h "$f"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnos-mac-dmg
          path: |
            mac/dist/*.dmg
            mac/dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.rel.outputs.tag != ''
        working-directory: mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.rel.outputs.tag }}"
          echo "publishing $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists, updating"
          else
            gh release create "$TAG" \
              --title "FNOS macOS ${TAG}" \
              --notes "macOS 版（免签名分发）：下载对应架构的 dmg，拖入「应用程序」即可。首次打开若提示已损坏，请执行：xattr -dr com.apple.quarantine /Applications/FNOS.app" \
              --latest=false
          fi

          for i in 1 2 3 4; do
            if gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber; then
              echo "upload ok"
              break
            fi
            echo "upload retry $i"
            sleep 6
          done

          echo "== assets on release =="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'

      - name: Verify release assets
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | test("\\.(dmg|zip)$"))] | length')
          echo "dmg/zip assets: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::expected at least 2 assets (dmg + zip), got $COUNT"
            exit 1
          fi
