name: macOS Build

# 与 Windows 版同版本发布：同一个 v* tag 触发，产物追加到同一个 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（形如 v3.0.81；留空则只构建产物不发布）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS (arm64 + x64)
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ''
      CSC_KEY_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show toolchain
        run: |
          node -v
          npm -v
          sw_vers
          xcodebuild -version || true

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "resolved tag=[$TAG]"

      - name: Sync version from tag
        if: steps.rel.outputs.tag != ''
        shell: bash
        run: |
          VERSION="${{ steps.rel.outputs.version }}"
          echo "sync mac/package.json -> $VERSION"
          node -e '
            const fs = require("fs");
            const p = "mac/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$VERSION"
          node -e 'console.log("package.json version =", require("./mac/package.json").version)'

      - name: Install dependencies
        working-directory: mac
        run: npm install --no-audit --no-fund

      - name: Sanity check sources
        working-directory: mac
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then echo "::error file=$f::syntax error"; fail=1; fi
          done < <(find src -name '*.js' -type f | sort)
          echo "checked: $(find src -name '*.js' -type f | wc -l) files"
          exit $fail

      - name: Build dmg + zip
        working-directory: mac
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Inspect artifacts
        working-directory: mac
        run: |
          ls -lh dist || true
          for f in dist/*.dmg dist/*.zip; do
            [ -e "$f" ] || continue
            echo "== $f"
            file "$f"
            du -h "$f"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnos-mac-dmg
          path: |
            mac/dist/*.dmg
            mac/dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: steps.rel.outputs.tag != ''
        working-directory: mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.rel.outputs.tag }}"
          echo "publishing $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists (Windows 已创建)，直接追加 macOS 资产"
          else
            gh release create "$TAG" \
              --title "FNOS ${TAG}" \
              --notes "FNOS 桌面客户端 ${TAG}：Windows 与 macOS 同版本发布。macOS 为免签名分发，下载对应架构 dmg 拖入「应用程序」即可；首次打开若提示损坏，请在终端执行：xattr -dr com.apple.quarantine /Applications/FNOS.app" \
              || echo "create raced, continue"
          fi

          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber; then
              echo "upload ok"
              break
            fi
            echo "upload retry $i"
            sleep 6
          done

          echo "== assets on release =="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'

      - name: Verify release assets
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | test("\\.(dmg|zip)$"))] | length')
          echo "macOS dmg/zip assets: $COUNT"
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::expected 4 macOS assets (dmg+zip × arm64/x64), got $COUNT"
            exit 1
          fi
