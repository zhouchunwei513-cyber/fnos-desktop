<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>FNOS 已锁定</title>
  <link rel="stylesheet" href="dialog.css" />
  <link rel="stylesheet" href="lock.css" />
</head>
<body class="lock-body">
  <div class="aurora" aria-hidden="true">
    <svg class="aurora-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="blurL" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="90" />
        </filter>
      </defs>
      <rect width="1920" height="1080" fill="#05060a"/>
      <g filter="url(#blurL)" opacity="0.85">
        <path d="M-150 720 C 220 520 480 980 820 740 S 1500 520 2070 800 L 2070 1200 L -150 1200 Z" fill="#ff5b8c" opacity="0.55"/>
        <path d="M-120 600 C 280 820 600 380 980 620 S 1600 920 2050 540 L 2050 1180 L -120 1180 Z" fill="#ffd166" opacity="0.5"/>
        <path d="M-100 820 C 360 620 720 1020 1100 780 S 1680 520 2060 820 L 2060 1200 L -100 1200 Z" fill="#43e7ff" opacity="0.55"/>
        <path d="M-160 500 C 260 700 600 460 960 560 S 1620 720 2080 480 L 2080 1180 L -160 1180 Z" fill="#8b6bff" opacity="0.45"/>
      </g>
    </svg>
  </div>

  <main class="lock-card glass">
    <div class="lock-logo" aria-hidden="true">
      <svg viewBox="0 0 128 128" width="72" height="72" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7cecff"/>
            <stop offset="0.5" stop-color="#7c83ff"/>
            <stop offset="1" stop-color="#ff6bcb"/>
          </linearGradient>
        </defs>
        <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#lg)"/>
        <path d="M40 40
                 C 32 40, 28 48, 30 58
                 C 31 64, 36 68, 42 68
                 L 42 86
                 C 42 92, 47 96, 53 96
                 L 70 96
                 C 76 96, 81 92, 81 86
                 L 81 78
                 C 81 74, 84 71, 88 71
                 L 104 71
                 C 104 60, 96 52, 86 52
                 L 56 52
                 L 56 40 Z"
              fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 id="lock-title" class="lock-title">FNOS 已锁定</h1>
    <p id="lock-subtitle" class="lock-subtitle">输入启动密码以恢复</p>

    <!-- 解锁 -->
    <form id="unlock-form" class="lock-form" autocomplete="off">
      <div class="input-wrap glass-input">
        <input id="unlock-pwd" type="password" placeholder="启动密码" autocomplete="current-password" spellcheck="false" />
        <button type="button" id="toggle-pwd" class="eye" aria-label="显示密码">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div id="unlock-error" class="lock-error" hidden></div>
      <button class="btn-primary lock-btn" id="unlock-btn" type="submit">
        <span class="btn-label">解 锁</span>
      </button>
      <button type="button" id="goto-change" class="link-btn">修改 / 取消启动密码</button>
    </form>

    <!-- 首次设置 / 修改密码 -->
    <form id="setup-form" class="lock-form" autocomplete="off" hidden>
      <div class="input-wrap glass-input">
        <input id="old-pwd" type="password" placeholder="当前密码（首次设置留空）" autocomplete="off" spellcheck="false" />
      </div>
      <div class="input-wrap glass-input">
        <input id="new-pwd" type="password" placeholder="新密码（至少 4 位）" autocomplete="new-password" spellcheck="false" />
      </div>
      <div class="input-wrap glass-input">
        <input id="confirm-pwd" type="password" placeholder="再次输入新密码" autocomplete="new-password" spellcheck="false" />
      </div>
      <div id="setup-error" class="lock-error" hidden></div>
      <div class="setup-actions">
        <button type="button" class="btn-ghost" id="setup-cancel">取消</button>
        <button type="submit" class="btn-primary" id="setup-save">保存</button>
      </div>
    </form>

    <div class="lock-meta">
      <span>FNOS 桌面客户端</span>
      <span class="dot">·</span>
      <span id="version-tag"></span>
    </div>
  </main>

  <script src="lock.js"></script>
</body>
</html>
