<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>FNOS Menu</title>
<style>
  /* v3.0.64：自绘应用菜单（替代 Windows 原生菜单），两套皮：glass（跟随设置页玻璃）/ dark（深色） */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: "PingFang SC", "Microsoft YaHei", "HarmonyOS Sans SC", "Source Han Sans SC", system-ui, sans-serif;
    color: #e9efff;
  }
  #root { position: relative; width: 100%; height: 100%; }

  .panel {
    position: absolute;
    left: 0; top: 0;
    min-width: 92px;
    padding: 6px;
    box-sizing: border-box;
    border-radius: 16px;
    background: rgba(17, 21, 32, .98);
    border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .48), 0 2px 8px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  body.glass .panel {
    /* v3.0.81：跟随「透明界面」滑块（--fnos-ui-a 由 menu-popup.js 写入） */
    background: rgba(5, 6, 10, var(--fnos-ui-a, .38));
    border-color: rgba(255, 255, 255, .12);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .52), 0 2px 10px rgba(0, 0, 0, .38);
  }

  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 30px;
    padding: 0 10px;
    min-height: 30px;
    border-radius: 9px;
    white-space: nowrap;
    font-size: 13px;
    line-height: 1;
  }
  .item .mark {
    flex: 0 0 12px;
    color: #8fb3ff;
    font-size: 12px;
    text-align: center;
  }
  .item .lbl {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 400px;
  }
  .item .acc {
    flex: 0 0 auto;
    margin-left: 22px;
    color: rgba(233, 239, 255, .45);
    font-size: 12px;
    letter-spacing: .2px;
  }
  .item .arrow {
    flex: 0 0 auto;
    margin-left: 10px;
    color: rgba(233, 239, 255, .5);
    font-size: 15px;
    line-height: 1;
  }
  .item.disabled { color: rgba(233, 239, 255, .3); }
  .item.disabled .acc, .item.disabled .arrow { color: rgba(233, 239, 255, .2); }
  .item:not(.disabled):hover { background: rgba(255, 255, 255, .10); }
  body.glass .item:not(.disabled):hover { background: rgba(255, 255, 255, .16); }

  .sep {
    height: 1px;
    margin: 6px 8px;
    background: rgba(255, 255, 255, .08);
  }
  body.glass .sep { background: rgba(255, 255, 255, .12); }
</style>
</head>
<body class="dark">
  <div id="root"></div>
  <script src="menu-popup.js"></script>
</body>
</html>
