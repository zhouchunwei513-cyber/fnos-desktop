<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: https: http:; media-src 'self' file: data: blob: https: http:; script-src 'self'; font-src 'self' data:;" />
<title>FNOS</title>
<style>
  :root {
    --tb-height: 38px;
    --tb-bg: rgba(24,28,38,0.86);
    --tb-fg: #e7ecf3;
    --tb-accent: #0a84ff;
    --tb-btn-hover: rgba(255,255,255,0.10);
    --tb-btn-active: rgba(255,255,255,0.16);
    --tb-divider: rgba(255,255,255,0.08);
    --tb-radius: 0px;
    --tb-alpha: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── macOS 外壳工具栏：自绘，绝不注入到 NAS 页面 ── */
  #titlebar {
    position: relative;
    display: flex;
    align-items: stretch;
    height: var(--tb-height);
    flex: 0 0 var(--tb-height);
    padding-left: 78px;            /* 让开 traffic lights */
    background: var(--tb-bg);
    color: var(--tb-fg);
    user-select: none;
    -webkit-user-select: none;
    z-index: 10;
    overflow: hidden;
    border-bottom: 1px solid var(--tb-divider);
  }
  /* 皮肤背景层（图片 / GIF / 视频由主进程下发） */
  #skin-layer {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity .18s ease;
  }
  #skin-layer.on { opacity: 1; }
  #skin-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #skin-horn { position: absolute; right: 0; top: 0; height: 100%; z-index: 1; pointer-events: none; display: none; }
  #tb-veil { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

  #drag-region {
    position: relative; z-index: 2;
    flex: 0 1 auto;
    -webkit-app-region: drag;
    display: flex; align-items: center;
    padding: 0 8px 0 2px;
    min-width: 40px; height: 100%;
    max-width: 42%;
  }
  #app-icon { width: 17px; height: 17px; margin-right: 7px; flex: 0 0 auto; border-radius: 4px; object-fit: cover; }
  #app-title {
    font-size: 13px; font-weight: 500; letter-spacing: .2px;
    opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── 菜单栏（点击后由主进程弹原生 Menu） ── */
  #menubar {
    position: relative; z-index: 2;
    display: flex; align-items: stretch; height: 100%;
    -webkit-app-region: no-drag;
    flex: 0 0 auto;
  }
  .menu-item {
    display: flex; align-items: center;
    padding: 0 9px;
    font-size: 12.5px;
    cursor: default;
    height: 100%;
    border-radius: 5px;
    margin: 5px 0;
    opacity: .9;
    transition: background .1s ease;
  }
  .menu-item:hover, .menu-item.open { background: var(--tb-btn-hover); opacity: 1; }
  .menu-item:active { background: var(--tb-btn-active); }

  /* 拖拽填充区 */
  #drag-fill { flex: 1 1 auto; -webkit-app-region: drag; height: 100%; min-width: 20px; }

  /* 右侧动作区（刷新 / 设置入口） */
  #tb-actions {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 2px;
    padding-right: 8px; height: 100%;
    -webkit-app-region: no-drag;
    flex: 0 0 auto;
  }
  .tb-btn {
    width: 26px; height: 26px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--tb-fg); opacity: .78;
    cursor: default; transition: background .1s ease, opacity .1s ease;
  }
  .tb-btn:hover { background: var(--tb-btn-hover); opacity: 1; }
  .tb-btn:active { background: var(--tb-btn-active); }
  .tb-btn svg { width: 14px; height: 14px; }
  #busy-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--tb-accent);
    opacity: 0; transition: opacity .2s ease; margin-right: 4px;
  }
  #busy-dot.on { opacity: 1; }

  /* Windows 版遗留的窗控按钮：macOS 用原生 traffic lights，隐藏但保留节点（shell.js 依赖） */
  #win-controls { display: none !important; }

  /* ── 内容区：承载 webview ── */
  #content {
    flex: 1 1 auto; position: relative; min-height: 0;
    background: transparent; overflow: hidden;
  }
  webview {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%; border: 0; outline: none;
    background: transparent;
  }

  /* ── 加载遮罩 ── */
  #loader {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--tb-bg); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 5; color: #9aa6b6; font-size: 13px; letter-spacing: .3px;
  }
  #loader.hidden { display: none; }
  .spinner {
    width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.16);
    border-top-color: var(--tb-accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 窗口非激活时降低对比，符合 macOS 观感 */
  body[data-focused="false"] #titlebar { opacity: .92; }
</style>
</head>
<body>
  <div id="titlebar">
    <div id="skin-layer"><video id="skin-video" muted loop playsinline></video></div>
    <img id="skin-horn" src="" alt="" />
    <div id="tb-veil"></div>

    <div id="drag-region">
      <img id="app-icon" src="../../assets/fnos-logo.png" alt="" />
      <span id="app-title">FNOS</span>
    </div>

    <div id="menubar">
      <div class="menu-item" data-menu="file">文件</div>
      <div class="menu-item" data-menu="downloads">下载</div>
      <div class="menu-item" data-menu="view">视图</div>
      <div class="menu-item" data-menu="tools">工具</div>
      <div class="menu-item" data-menu="settings">设置</div>
      <div class="menu-item" data-menu="help">帮助</div>
    </div>

    <div id="drag-fill"></div>

    <div id="tb-actions">
      <span id="busy-dot"></span>
      <div class="tb-btn" id="btn-home" title="回到首页">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.6 7.4 8 3l5.4 4.4V13a.6.6 0 0 1-.6.6H10V9.6H6V13.6H3.2a.6.6 0 0 1-.6-.6Z"/>
        </svg>
      </div>
      <div class="tb-btn" id="btn-reload" title="重新加载">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13.2 2.2v3.2h-3.2"/>
        </svg>
      </div>
      <div class="tb-btn" id="btn-settings" title="设置">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M8 1.8v1.6M8 12.6v1.6M2.2 8h1.6M12.2 8h1.6M3.9 3.9l1.1 1.1M11 11l1.1 1.1M12.1 3.9 11 5M5 11l-1.1 1.1"/>
        </svg>
      </div>
    </div>

    <!-- 保留节点：shell.js 会绑定事件，macOS 下不显示 -->
    <div id="win-controls">
      <div class="win-btn" id="btn-min" title="最小化">
        <svg viewBox="0 0 12 12"><rect x="2" y="5.6" width="8" height="1" fill="currentColor"/></svg>
      </div>
      <div class="win-btn" id="btn-max" title="最大化/还原">
        <svg id="icon-max" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </div>
      <div class="win-btn close" id="btn-close" title="关闭">
        <svg viewBox="0 0 12 12"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

  <div id="content">
    <div id="loader"><div class="spinner"></div><span id="loader-text">正在连接…</span></div>
  </div>

<script src="shell.js"></script>
<script src="shell-mac.js"></script>
</body>
</html>
