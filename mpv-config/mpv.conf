# FNOS 桌面客户端 · MPV 运行配置（由客户端通过 --config-dir 加载）
# 注意：shinchiro Windows 构建的 mpv 不提供 --lang 选项（也无 gettext 翻译文件），
#       在此或命令行写 lang= 都会报错（命令行未知选项甚至会导致 mpv 启动即退出）。
#       中文界面由 scripts/fnos-menu.lua（全中文右键菜单）提供，OSC 控制条本身是图标无语言障碍。

# OSC 控制条：禁用内置英文 OSC，改由 scripts/osc-zh-cn.lua（中文定制）提供
# 命令行也显式传了 --no-osc + --script=osc-zh-cn.lua，这里保持一致
osc=no
osd-bar=yes
# fnOS：OSD 与菜单统一使用 Windows 自带中文字体，保证中文控制条/弹窗一致渲染（可逐族回退）
osd-font="Microsoft YaHei, SimHei, Arial Unicode MS, sans-serif"
# 状态提示文字：更小字号、更短停留，避免大字遮挡画面
osd-font-size=18
osd-duration=1500
# v1.36.0：修正无效选项名（旧写 osd-msg-* 在此构建里不存在、每次启动报错）。
# 正确选项为 osd-color / osd-back-color / osd-border-size。
osd-color="#FFFFFF"
osd-back-color="#00000066"
osd-border-size=0.8
osd-shadow-offset=1
# OSD 状态提示（未找到字幕/弹幕等）：顶部对齐 + 下移留白，避免压住画面顶部片名/标题栏。
# osd-align-x/y 控制 osd_message 文字锚点；margin 留出边距。
osd-align-x=center
osd-align-y=top
osd-margin-x=40
osd-margin-y=60
# 正片字幕（外挂 srt/ass）：整体抬高，避免压在底部 OSC 进度条上产生“花边/叠字”。
sub-align-x=center
sub-align-y=bottom
sub-margin-y=90
sub-scale=1.0
# 出错/缓冲等待时停在最后一帧，不退回待机画面
keep-open=yes
