# FNOS 桌面客户端 · MPV 运行配置（由客户端通过 --config-dir 加载）
# 注意：shinchiro Windows 构建的 mpv 不提供 --lang 选项（也无 gettext 翻译文件），
#       在此或命令行写 lang= 都会报错（命令行未知选项甚至会导致 mpv 启动即退出）。
#       中文界面由 scripts/fnos-menu.lua（全中文右键菜单）提供，OSC 控制条本身是图标无语言障碍。

# OSC 控制条使用内置布局（图标按钮，无语言障碍）
osc=yes
osd-bar=yes
# 出错/缓冲等待时停在最后一帧，不退回待机画面
keep-open=yes
