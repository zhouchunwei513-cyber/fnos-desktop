# FNOS 桌面客户端 · mpv 内置右键菜单（@context_menu.lua）样式统一配置
# 控制所有由脚本弹出的菜单：右键主菜单、OSC ☰ 菜单、音轨/字幕/倍速子菜单。
# 字体统一由 mpv.conf 的 osd-font 指定（中文优先），这里统一字号、间距与配色，
# 使其与 OSC 控制条（深色半透明背景、白色文字、高对比选中项）风格一致。

font_size=22
gap=0.35
padding_x=14
padding_y=8
corner_radius=6
menu_outline_size=1.0
# 选中项：深色背景上的高亮（与默认 OSC 反色不同，改用品牌粉高亮，保持 fnOS 观感）
focused_color=#FFFFFF
focused_back_color=#F46B95
disabled_color=#8A8A8A
seconds_to_open_submenus=0.15
seconds_to_close_submenus=0.15
scale_with_window=auto
